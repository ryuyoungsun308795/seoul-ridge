<head>

<meta name="apple-mobile-web-app-capable" content="yes">

<title>서울근교 능선 코스</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/sun-typeface/SUIT@2/fonts/variable/woff2/SUIT-Variable.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  :root { --bg:#F2F4F6; --card:#fff; --ink:#191F28; --sub:#4E5968; --mute:#8B95A1; --line:#E5E8EB; --blue:#3182F6; --bluebg:#EEF6FF; --up:#FF3B30; --down:#14C76B; }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; overflow:hidden; background:var(--bg); color:var(--ink);
    font-family:'SUIT Variable','SUIT','Pretendard',-apple-system,sans-serif; letter-spacing:-.01em; }
  #app { max-width:430px; height:var(--app-h, 100dvh); margin:0 auto; display:flex; flex-direction:column; gap:8px;
    padding:calc(env(safe-area-inset-top) + 8px) 12px calc(env(safe-area-inset-bottom) + 10px); }
  .banner { display:none; flex:0 0 auto; background:var(--blue); color:#fff; border-radius:16px; padding:12px 14px; font-size:15px; line-height:1.45; }
  .banner.on { display:block; }
  .banner .row { display:flex; gap:8px; margin-top:8px; }
  .banner button { flex:1; height:44px; border:0; border-radius:12px; font-weight:800; font-size:15px; font-family:inherit; cursor:pointer; }
  .banner .yes { background:#fff; color:var(--blue); }
  .banner .no { background:rgba(255,255,255,.2); color:#fff; }
  .top { flex:0 0 auto; display:flex; align-items:center; gap:8px; height:40px; }
  .bk { display:none; align-items:center; gap:2px; border:0; background:var(--bluebg); color:var(--blue); font-weight:800; font-size:16px; font-family:inherit; padding:8px 13px; border-radius:999px; cursor:pointer; }
  .bk b { font-size:20px; line-height:16px; }
  .apptitle { font-size:20px; font-weight:800; }
  .tabs { flex:0 0 auto; display:grid; grid-template-columns:repeat(3, 1fr); gap:6px; }
  .tab { height:52px; border:0; border-radius:14px; background:var(--card); color:var(--sub); font-weight:700; font-size:17px; font-family:inherit; cursor:pointer; box-shadow:0 1px 3px rgba(0,0,0,.05); }
  .tab.on { background:var(--blue); color:#fff; }
  .head { flex:0 0 auto; background:var(--card); border-radius:20px; padding:10px 14px; box-shadow:0 1px 3px rgba(0,0,0,.05); }
  .title { font-size:18px; font-weight:800; text-align:center; }
  .stats { display:grid; grid-template-columns:repeat(3, 1fr); margin-top:6px; text-align:center; }
  .stats b { display:block; font-size:22px; font-weight:800; color:var(--blue); }
  .stats span { font-size:14px; color:var(--mute); }
  .mapwrap { position:relative; flex:0 0 auto; height:300px; border-radius:20px; overflow:hidden; background:#2b3a2b; }
  #map { position:absolute; inset:0; background:#2b3a2b; }
  .compass { position:absolute; left:8px; top:8px; z-index:500; width:64px; height:64px; pointer-events:none; }
  .lbl { white-space:nowrap; background:rgba(255,255,255,.96); border-radius:8px; box-shadow:0 1px 4px rgba(0,0,0,.4);
    font:700 14px/24px 'SUIT Variable','SUIT','Pretendard',sans-serif; color:var(--ink); text-align:center; }
  .lbl.end { background:var(--blue); color:#fff; }
  .leaflet-control-scale-line { font:700 13px 'SUIT Variable','SUIT',sans-serif; }
  .leaflet-control-attribution { font-size:10px; }
  .prof { flex:1 1 auto; min-height:200px; background:var(--card); border-radius:20px; padding:10px 8px 6px; display:flex; flex-direction:column; box-shadow:0 1px 3px rgba(0,0,0,.05); }
  .prof h2 { font-size:16px; font-weight:800; text-align:center; }
  .legend { display:flex; justify-content:center; gap:14px; font-size:14px; color:var(--sub); margin-top:2px; }
  .legend i { display:inline-block; width:22px; height:5px; border-radius:3px; vertical-align:middle; margin-right:5px; }
  .svgbox { flex:1 1 auto; position:relative; min-height:150px; }
  #prof { position:absolute; inset:0; width:100%; height:100%; }
  .note { font-size:14px; color:var(--mute); text-align:center; }
  svg text { font-family:'SUIT Variable','SUIT','Pretendard',sans-serif; }
</style>
</head>
<body>
<div id="app">
  <div class="banner" id="kakao">카톡 안에서 열면 다른 대화로 갈 때 닫힙니다<br>안 열리면 오른쪽 아래 ⋮ → 다른 브라우저로 열기
    <div class="row"><button class="yes" id="kakaoGo">크롬으로 열기</button></div></div>
  <div class="banner" id="inst">이 앱을 설치할까요?<br>홈 화면에서 바로 열 수 있습니다
    <div class="row"><button class="yes" id="instYes">설치</button><button class="no" id="instNo">나중에</button></div></div>
  <div class="top">

  </div>

  </div>

  </div>
</div>

    if (/Android/i.test(UA)) setTimeout(() => {
      if (document.visibilityState === 'hidden') return;
      location.href = 'intent://' + location.href.replace(/^https?:\/\//, '') + '#Intent;scheme=https;package=com.android.chrome;end';
      setTimeout(() => { if (document.visibilityState !== 'hidden')
        location.href = 'intent://' + location.href.replace(/^https?:\/\//, '') + '#Intent;scheme=https;end'; }, 900);
    }, 900);
  };
  if (/iPhone|iPad/i.test(UA)) $('kakaoGo').textContent = '사파리로 열기';
  $('kakaoGo').onclick = go;
  go();
}

// ── 홈 화면 설치
let deferred = null;
const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
const later = () => { try { return localStorage.getItem('ridge-install-later') === '1'; } catch (e) { return false; } };
addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferred = e;
  if (!standalone && !later()) { $('inst').classList.add('on'); relayout(); } });
$('instYes').onclick = async () => { $('inst').classList.remove('on'); relayout(); if (deferred) { deferred.prompt(); deferred = null; } };
$('instNo').onclick = () => { try { localStorage.setItem('ridge-install-later', '1'); } catch (e) {} $('inst').classList.remove('on'); relayout(); };
addEventListener('appinstalled', () => { $('inst').classList.remove('on'); relayout(); });
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost'))
  navigator.serviceWorker.register('sw.js');

// ── 지도
const map = L.map('map', { zoomControl:false, zoomSnap:0.1, zoomDelta:0.5, attributionControl:true });
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
  { maxNativeZoom:18, maxZoom:19, attribution:'위성사진 Esri · 등산로 OpenStreetMap' }).addTo(map);
map.attributionControl.setPrefix(false);
L.control.scale({ metric:true, imperial:false, position:'bottomleft' }).addTo(map);
const lineLayer = L.layerGroup().addTo(map), lblLayer = L.layerGroup().addTo(map);

let cur = -1, bounds = null;
const tabs = $('tabs');
R.forEach((r, i) => {
  const b = document.createElement('button');
  b.className = 'tab'; b.textContent = SHORT[r.id];
  b.onclick = e => { if (i === cur) return;
    if (cur === 0 && e.isTrusted && !(history.state && history.state.bp)) history.pushState({ bp:1 }, '');
    show(i); };
  tabs.appendChild(b);
});

// ── 뒤로가기: 다른 코스 → 첫 코스 → 앱 밖
$('bk').onclick = () => history.back();
addEventListener('popstate', () => { if (cur !== 0) show(0); });
if (history.state && history.state.bp) history.back();

function show(i){
  cur = i;
  const r = R[i];
  [...tabs.children].forEach((b, j) => b.classList.toggle('on', i === j));
  $('bk').style.display = i === 0 ? 'none' : 'inline-flex';
  $('title').textContent = r.name;
  $('km').textContent = r.km + 'km';
  $('up').textContent = r.up.toLocaleString() + 'm';
  $('max').textContent = Math.max(...r.wps.map(w => w.ele), r.max) + 'm';
  lineLayer.clearLayers();
  const all = r.runs.flatMap((x, k) => k ? x.pts.slice(1) : x.pts);
  L.polyline(all, { color:'#fff', weight:9, opacity:.95, interactive:false }).addTo(lineLayer);
  r.runs.forEach(x => L.polyline(x.pts, { color: x.up ? UP : DOWN, weight:5, interactive:false }).addTo(lineLayer));
  r.wps.forEach((w, k) => {
    const end = k === 0 || k === r.wps.length - 1;
    L.circleMarker([w.lat, w.lon], { radius: end ? 8 : 5, color:'#fff', weight:2, fillColor: end ? '#3182F6' : '#191F28', fillOpacity:1 })
      .bindTooltip(`${w.short || w.name} ${w.ele}m`, { direction:'top' }).addTo(lineLayer);
  });
  bounds = L.latLngBounds(all);
  relayout();
}

// 지도 높이를 코스 모양에 맞춰 정한다(가로로 긴 코스는 낮게 → 주변 도시가 덜 들어감)
let rl = 0;
function relayout(){
  if (cur < 0) return;
  cancelAnimationFrame(rl);
  rl = requestAnimationFrame(() => {
    const wrap = $('mapwrap'), app = $('app');
    const W = wrap.clientWidth, PAD = 22;
    const z = 15, nw = map.project(bounds.getNorthWest(), z), se = map.project(bounds.getSouthEast(), z);
    const aspect = (se.y - nw.y) / (se.x - nw.x);
    const want = (W - 2 * PAD) * aspect + 2 * PAD;
    const used = [...app.children].filter(el => el !== wrap && !el.classList.contains('prof'))
      .reduce((s, el) => s + (el.offsetParent ? el.offsetHeight + 8 : 0), 0);
    const cs = getComputedStyle(app);
    const avail = app.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom) - used - 8 - 280;
    wrap.style.height = Math.round(Math.max(220, Math.min(want, avail))) + 'px';
    map.invalidateSize();
    map.fitBounds(bounds, { padding:[PAD, PAD], animate:false });
    placeLabels();
    drawProfile(R[cur]);
  });
}
map.on('zoomend', () => { if (cur >= 0) placeLabels(); });

// ── 지도 이름표: 서로·점·나침반·가장자리와 겹치지 않는 자리를 고르고, 코스 선은 되도록 피한다
const ctx = document.createElement('canvas').getContext('2d');
function textW(s){ ctx.font = FONT; return Math.ceil(ctx.measureText(s).width); }
function placeLabels(){
  lblLayer.clearLayers();
  const r = R[cur], size = map.getSize(), W = size.x, H = size.y;
  const hard = [[0, 0, 80, 80]];
  const att = document.querySelector('.leaflet-control-attribution'), sc = document.querySelector('.leaflet-control-scale');
  const mr = $('map').getBoundingClientRect();
  [att, sc].forEach(el => { if (el) { const b = el.getBoundingClientRect(); hard.push([b.left - mr.left - 2, b.top - mr.top - 2, b.right - mr.left + 2, b.bottom - mr.top + 2]); } });
  const pts = r.wps.map(w => map.latLngToContainerPoint([w.lat, w.lon]));
  pts.forEach((p, k) => { const rr = (k === 0 || k === r.wps.length - 1) ? 10 : 7; hard.push([p.x - rr, p.y - rr, p.x + rr, p.y + rr]); });
  const linePts = [];
  r.runs.forEach(x => x.pts.forEach((q, k) => { if (k % 2 === 0) linePts.push(map.latLngToContainerPoint(q)); }));
  const hit = (a, b) => a[0] < b[2] && a[2] > b[0] && a[1] < b[3] && a[3] > b[1];
  const n = r.wps.length;
  const order = [0, n - 1, ...r.wps.map((w, k) => k).filter(k => k > 0 && k < n - 1 && r.wps[k].major)
    .sort((a, b) => r.wps[b].ele - r.wps[a].ele)];
  const placed = [];
  order.forEach(k => {
    const w = r.wps[k], p = pts[k], end = k === 0 || k === n - 1;
    const text = (k === 0 ? '출발 ' : k === n - 1 ? '도착 ' : '') + (w.short || w.name);
    const bw = textW(text) + 16, bh = 24, g = end ? 12 : 9;
    const cands = [[g, -bh / 2], [-bw - g, -bh / 2], [-bw / 2, -bh - g], [-bw / 2, g],
                   [g - 2, -bh - g + 4], [g - 2, g - 4], [-bw - g + 2, -bh - g + 4], [-bw - g + 2, g - 4]];
    let best = null;
    cands.forEach(([dx, dy], ci) => {
      const box = [p.x + dx, p.y + dy, p.x + dx + bw, p.y + dy + bh];
      if (box[0] < 4 || box[1] < 4 || box[2] > W - 4 || box[3] > H - 4) return;
      if (hard.some(h => hit(box, h))) return;
      if (placed.some(b => hit(box, [b[0] - 3, b[1] - 3, b[2] + 3, b[3] + 3]))) return;
      const cost = linePts.filter(q => q.x > box[0] && q.x < box[2] && q.y > box[1] && q.y < box[3]).length + ci * 0.3;
      if (!best || cost < best.cost) best = { box, dx, dy, cost };
    });
    if (!best) return;
    placed.push(best.box);
    L.marker([w.lat, w.lon], { interactive:false, keyboard:false,
      icon: L.divIcon({ className:'', html:`<div class="lbl${end ? ' end' : ''}" style="width:${bw}px">${text}</div>`,
        iconSize:[bw, bh], iconAnchor:[-best.dx, -best.dy] }) }).addTo(lblLayer);
  });
}

// ── 옆모습(고도) 그림: 이름표는 겹치지 않게 아래층부터 쌓고, 안내선이 다른 이름표를 지나지 않게 한다
function drawProfile(r){
  const svg = $('prof'), W = svg.clientWidth || 400, H = svg.clientHeight || 200;
  const L0 = 38, R0 = 10, B0 = 20, LH = 36;
  const T0 = LH + 16;
  const maxE = Math.ceil((Math.max(...r.prof.map(p => p[1]), ...r.wps.map(w => w.ele)) + 20) / 100) * 100;
  const X = km => L0 + km / r.km * (W - L0 - R0);
  const Y = e => T0 + (1 - e / maxE) * (H - T0 - B0);
  const near = km => { let best = r.prof[0]; for (const p of r.prof) if (Math.abs(p[0] - km) < Math.abs(best[0] - km)) best = p; return best[1]; };
  let s = '';
  const gstep = maxE > 600 ? 200 : 100;
  for (let e = 0; e <= maxE; e += gstep) {
    s += `<line x1="${L0}" x2="${W - R0}" y1="${Y(e)}" y2="${Y(e)}" stroke="#E5E8EB"/>`;
    s += `<text x="${L0 - 5}" y="${Y(e) + 4}" text-anchor="end" font-size="12" fill="#8B95A1">${e}</text>`;
  }
  const step = r.km > 12 ? 3 : 2;
  for (let k = 0; k <= r.km; k += step)
    s += `<text x="${X(k)}" y="${H - 4}" text-anchor="middle" font-size="12" fill="#8B95A1">${k}km</text>`;
  const P = r.prof.map(p => [X(p[0]), Y(p[1])]);
  s += `<defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8B95A1" stop-opacity=".35"/><stop offset="1" stop-color="#8B95A1" stop-opacity=".06"/></linearGradient></defs>`;
  s += `<polygon points="${X(0)},${Y(0)} ${P.map(q => q.join(',')).join(' ')} ${X(r.km)},${Y(0)}" fill="url(#g)"/>`;
  let i = 0;
  while (i < r.profUp.length) {
    let j = i; while (j < r.profUp.length && r.profUp[j] === r.profUp[i]) j++;
    s += `<polyline points="${P.slice(i, j + 1).map(q => q.map(v => v.toFixed(1)).join(',')).join(' ')}" fill="none" stroke="${r.profUp[i] ? UP : DOWN}" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>`;
    i = j;
  }
  const n = r.wps.length;
  const order = [0, n - 1, ...r.wps.map((w, k) => k).filter(k => k > 0 && k < n - 1 && r.wps[k].major)
    .sort((a, b) => r.wps[b].ele - r.wps[a].ele)];
  // 이름표(이름 위·높이 아래 2줄)를 봉우리 바로 위부터 조금씩 올리고 좌우로 비켜 보며 빈자리를 찾는다
  const boxes = [], leads = [];
  const hit = (p, q) => p[0] < q[2] + 4 && p[2] > q[0] - 4 && p[1] < q[3] + 3 && p[3] > q[1] - 3;
  const curveBelow = (a, b, bottom) => P.every(q => q[0] < a - 2 || q[0] > b + 2 || q[1] > bottom + 4);
  const dots = [];
  order.forEach(k => {
    const w = r.wps[k], x = X(w.km), py = Y(near(w.km));
    dots.push([x, py]);
    const name = w.short || w.name, el = `${w.ele}m`;
    const bw = Math.max(textW(name), textW(el)) + 6;
    let pick = null;
    for (let lift = 6; !pick && py - lift - LH >= 2; lift += 8) {
      for (const sh of [0, -.35, .35, -.7, .7]) {
        const a = x - bw / 2 + sh * bw, b = a + bw, bottom = py - lift, top = bottom - LH;
        if (a < L0 - 2 || b > W - 2) continue;
        const box = [a, top, b, bottom];
        if (!curveBelow(a, b, bottom)) continue;
        if (boxes.some(q => hit(box, q))) continue;
        if (leads.some(([lx, y1, y2]) => lx > a - 3 && lx < b + 3 && y2 > top && y1 < bottom)) continue;
        if (boxes.some(q => x > q[0] - 3 && x < q[2] + 3 && q[3] > bottom && q[1] < py)) continue;
        pick = { a, b, top, bottom }; break;
      }
    }
    if (!pick) return;
    boxes.push([pick.a, pick.top, pick.b, pick.bottom]);
    leads.push([x, pick.bottom, py]);
    const cx = (pick.a + pick.b) / 2;
    if (py - pick.bottom > 8)
      s += `<line x1="${x}" x2="${x}" y1="${pick.bottom + 1}" y2="${py - 4}" stroke="#191F28" stroke-opacity=".4" stroke-dasharray="2 2"/>`;
    s += `<g class="pl"><text x="${cx}" y="${pick.top + 15}" text-anchor="middle" font-size="14" font-weight="700" fill="#191F28" stroke="#fff" stroke-width="4" paint-order="stroke">${name}</text>`;
    s += `<text x="${cx}" y="${pick.top + 32}" text-anchor="middle" font-size="14" font-weight="800" fill="#3182F6" stroke="#fff" stroke-width="4" paint-order="stroke">${el}</text></g>`;
  });
  dots.forEach(([x, y]) => s += `<circle cx="${x}" cy="${y}" r="3.5" fill="#191F28"/>`);
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  svg.innerHTML = s;
}

show(0);
document.fonts && document.fonts.ready.then(() => relayout());
</script>
</body>
</html>
